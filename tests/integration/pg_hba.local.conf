# Custom pg_hba for the C2 integration test — forces cleartext 'password'
# auth so we exercise the AuthenticationCleartextPassword path without
# the server offering md5 or scram first.
#
# Mount over /etc/postgresql/pg_hba.conf in docker-compose when you want to
# flip the auth method. Default `docker-compose.yml` uses the image's
# built-in config which picks scram; C3's integration compose overrides it.
local   all all                trust
host    all all 127.0.0.1/32   password
host    all all ::1/128        password
host    all all all            password
